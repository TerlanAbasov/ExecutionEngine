databaseChangeLog:
    -   changeSet:
            id: 20260208-create-strategy-table
            author: Tarlan Abasov
            changes:
                -   createTable:
                        tableName: strategy
                        columns:
                            -   column:
                                    name: id
                                    type: INT
                                    autoIncrement: true
                                    constraints:
                                        primaryKey: true
                                        nullable: false
                            -   column:
                                    name: name
                                    type: VARCHAR(200)
                                    constraints:
                                        nullable: false
                                        unique: true
                            -   column:
                                    name: type
                                    type: VARCHAR(20)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: position_type
                                    type: VARCHAR(20)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: buy_order_type
                                    type: VARCHAR(20)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: buy_limit_ceiling
                                    type: NUMERIC(4,3)
                                    defaultValueComputed: "1.000"
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: sell_order_type
                                    type: VARCHAR(20)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: sell_limit_floor
                                    type: NUMERIC(5,3)
                                    defaultValueComputed: "1.000"
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: max_position_amount
                                    type: NUMERIC(15,2)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: take_profit_percentage
                                    type: INT
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: stop_loss_percentage
                                    type: INT
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: description
                                    type: VARCHAR(500)
                            -   column:
                                    name: created_at
                                    type: TIMESTAMP
                                    defaultValueComputed: CURRENT_TIMESTAMP
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: updated_at
                                    type: TIMESTAMP
                                    defaultValueComputed: CURRENT_TIMESTAMP
                                    constraints:
                                        nullable: false