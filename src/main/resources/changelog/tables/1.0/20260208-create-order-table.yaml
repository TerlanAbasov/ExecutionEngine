databaseChangeLog:
    -   changeSet:
            id: 20260208-create-order-table
            author: Tarlan Abasov
            changes:
                -   createTable:
                        tableName: order
                        columns:
                            -   column:
                                    name: id
                                    type: BIGINT
                                    autoIncrement: true
                                    constraints:
                                        primaryKey: true
                                        nullable: false
                            -   column:
                                    name: broker_order_id
                                    type: VARCHAR(255)
                                    constraints:
                                        nullable: false
                                        unique: true
                            -   column:
                                    name: strategy_id
                                    type: INT
                                    constraints:
                                        foreignKeyName: fk_order_strategy
                                        referencedTableName: strategy
                                        referencedColumnNames: id
                                        nullable: false
                            -   column:
                                    name: alert_id
                                    type: BIGINT
                            -   column:
                                    name: symbol
                                    type: VARCHAR(32)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: contract_id
                                    type: INT
                            -   column:
                                    name: parent_order_id
                                    type: BIGINT
                            -   column:
                                    name: action
                                    type: VARCHAR(20)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: status
                                    type: VARCHAR(20)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: order_type
                                    type: VARCHAR(20)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: quantity
                                    type: DOUBLE PRECISION
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: limit_price
                                    type: NUMERIC(15,2)
                            -   column:
                                    name: take_profit_price
                                    type: NUMERIC(15,2)
                            -   column:
                                    name: stop_loss_price
                                    type: NUMERIC(15,2)
                            -   column:
                                    name: submitted_at
                                    type: TIMESTAMP
                            -   column:
                                    name: filled_at
                                    type: TIMESTAMP
                            -   column:
                                    name: created_at
                                    type: TIMESTAMP
                                    defaultValueComputed: CURRENT_TIMESTAMP
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: updated_at
                                    type: TIMESTAMP
                                    defaultValueComputed: CURRENT_TIMESTAMP
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: error_message
                                    type: TEXT