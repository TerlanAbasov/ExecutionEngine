databaseChangeLog:
    -   changeSet:
            id: 20260220-create-execution-table
            author: Tarlan Abasov
            changes:
                -   createTable:
                        tableName: execution
                        columns:
                            -   column:
                                    name: id
                                    type: BIGINT
                                    autoIncrement: true
                                    constraints:
                                        primaryKey: true
                                        nullable: false
                            -   column:
                                    name: order_id
                                    type: BIGINT
                                    constraints:
                                        foreignKeyName: fk_execution_order
                                        referencedTableName: order
                                        referencedColumnNames: id
                                        nullable: false
                            -   column:
                                    name: exec_id
                                    type: VARCHAR(255)
                                    constraints:
                                        unique: true
                            -   column:
                                    name: price
                                    type: NUMERIC(15,2)
                            -   column:
                                    name: filled_quantity
                                    type: DOUBLE PRECISION
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: commission
                                    type: NUMERIC(15,2)
                            -   column:
                                    name: total_amount
                                    type: NUMERIC(15,2)
                            -   column:
                                    name: realized_pnl
                                    type: NUMERIC(15,2)
                            -   column:
                                    name: currency
                                    type: VARCHAR(3)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: created_at
                                    type: TIMESTAMP
                                    defaultValueComputed: CURRENT_TIMESTAMP
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: updated_at
                                    type: TIMESTAMP
                                    defaultValueComputed: CURRENT_TIMESTAMP
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: error_message
                                    type: TEXT